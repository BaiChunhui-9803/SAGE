[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-rts"
version = "0.1.0"
description = "Switch-aware graph planning with gated exploration for RTS micromanagement"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "SAGE contributors"}
]
keywords = ["graph-planning", "micromanagement", "starcraft2", "rts", "gated-exploration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scipy==1.13.1",
    "matplotlib==3.9.4",
    "networkx==3.4.2",
    "PyYAML==6.0.2",
    "streamlit==1.40.1",
    "plotly==5.24.1",
    "pyvis==0.3.2",
    "scikit-learn==1.5.2",
    "PyMuPDF==1.25.3",
    "Pillow==11.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
    "mypy>=0.900",
]

# Source-package metadata; the supported paper artifact is the source checkout.
# Historical Python 3.8 live SC2 runs use source and their separate environment.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
